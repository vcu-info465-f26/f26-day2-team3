name: Fetch NCAAF standings Data in Json

on:
  schedule:
    - cron: "59 3 18,24,25 10 *"
    - cron: "59 3 1 11 *"
    - cron: "59 4 7,8,14,15,21,22,28,29 11 *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to fetch"
        required: true
        default: "2026"

permissions:
  actions: read
  contents: write

concurrency:
  group: fetch-standings
  cancel-in-progress: false

jobs:
  update-standings:
    runs-on: ubuntu-latest
    env:
      SEASON: ${{ github.event.inputs.season || '2026' }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # Ensure your LLM key is exposed to the runner
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Eastern game date and season week
        id: schedule
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
            utc_date="$(date -u -d "$created_at" '+%Y-%m-%d')"
            run_date="$(date -u -d "$utc_date -1 day" '+%Y-%m-%d')"
          else
            run_date="$(TZ=America/New_York date '+%Y-%m-%d')"
          fi
          if [[ "${run_date:0:4}" != "$SEASON" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${run_date:5}" in
            10-17) week=7 ;;
            10-23|10-24) week=8 ;;
            10-31) week=9 ;;
            11-06|11-07) week=10 ;;
            11-13|11-14) week=11 ;;
            11-20|11-21) week=12 ;;
            11-27|11-28) week=13 ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "date=$run_date" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "branch=fetch/${SEASON}-week-${week}" >> "$GITHUB_OUTPUT"

      - name: Skip if today's snapshot already exists on main
        id: existing
        if: steps.schedule.outputs.run == 'true'
        run: |
          if [[ -f "data/${{ steps.schedule.outputs.date }}.json" ]]; then
            echo "Snapshot for ${{ steps.schedule.outputs.date }} already exists on main; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse weekly snapshot branch
        if: steps.schedule.outputs.run == 'true' && steps.existing.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.schedule.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            git fetch origin "$BRANCH"
            git checkout -b "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi

      - name: Skip if snapshot already exists on weekly branch
        id: weekly
        if: steps.schedule.outputs.run == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          if [[ -f "data/${{ steps.schedule.outputs.date }}.json" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.weekly.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.weekly.outputs.skip == 'false'
        run: python -m pip install -r requirements.txt

      - name: Fetch standings
        if: steps.weekly.outputs.skip == 'false'
        env:
          SNAPSHOT_DATE: ${{ steps.schedule.outputs.date }}
        run: |
          fetch_directory="$(mktemp -d)"
          trap 'rm -rf "$fetch_directory"' EXIT
          mkdir -p "$fetch_directory/src"
          cp src/fetch.py "$fetch_directory/src/fetch.py"
          python "$fetch_directory/src/fetch.py" --season "$SEASON"
          snapshots=("$fetch_directory"/data/*.json)
          [[ ${#snapshots[@]} -eq 1 && -f "${snapshots[0]}" ]]
          mkdir -p data
          mv "${snapshots[0]}" "data/$SNAPSHOT_DATE.json"

      - name: Verify daily snapshot
        if: steps.weekly.outputs.skip == 'false'
        run: test -f "data/${{ steps.schedule.outputs.date }}.json"

      - name: Generate daily summary
        if: steps.weekly.outputs.skip == 'false'
        run: |
          # Fail-safe: '|| echo ...' ensures a crash in summarize.py doesn't kill the workflow
          python src/summarize.py || echo "Summary model call failed; carrying on to commit snapshot and retaining old summary."

      - name: Commit snapshot and summary
        id: commit
        if: steps.weekly.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the new data snapshot
          git add -f "data/${{ steps.schedule.outputs.date }}.json"
          
          # Stage the summary file if it exists (whether updated or untouched)
          if [[ -f "data/summary.md" ]]; then
            git add "data/summary.md"
          fi
          
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          git commit -m "Add NCAAF snapshot and update summary for ${{ steps.schedule.outputs.date }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push snapshot branch
        if: steps.commit.outputs.changed == 'true'
        run: git push -u origin "${{ steps.schedule.outputs.branch }}"