name: Fetch NCAAF standings Data in Json

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to fetch"
        required: true
        default: "2026"

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: fetch-standings
  cancel-in-progress: false

jobs:
  update-standings:
    # 2. Removed the "if: github.event_name == 'schedule'" to allow manual runs
    runs-on: ubuntu-latest
    env:
      SEASON: ${{ github.event.inputs.season || '2026' }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Eastern game date and season week
        id: schedule
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
            utc_date="$(date -u -d "$created_at" '+%Y-%m-%d')"
            run_date="$(date -u -d "$utc_date -1 day" '+%Y-%m-%d')"
          else
            run_date="$(TZ=America/New_York date '+%Y-%m-%d')"
          fi
          
          # Allow games in January of the following year (e.g. Jan 1, 2027 for the 2026 season)
          NEXT_SEASON=$((SEASON + 1))
          if [[ "${run_date:0:4}" != "$SEASON" && "${run_date:0:4}" != "$NEXT_SEASON" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          case "${run_date:5}" in
            10-17) week=7 ;;
            10-23|10-24) week=8 ;;
            10-31) week=9 ;;
            11-06|11-07) week=10 ;;
            11-13|11-14) week=11 ;;
            11-20|11-21) week=12 ;;
            11-27|11-28) week=13 ;;
            12-04|12-05) week=14 ;;
            12-12) week=15 ;;
            12-15|12-16) week=bowls ;;
            12-18|12-19) week=cfp-first-round ;;
            12-30|01-01) week=cfp-quarterfinals ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "date=$run_date" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "branch=fetch/${SEASON}-week-${week}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Fetch standings and compare data
        id: fetch
        if: steps.schedule.outputs.run == 'true'
        continue-on-error: true
        env:
          SNAPSHOT_DATE: ${{ steps.schedule.outputs.date }}
        run: |
          fetch_directory="$(mktemp -d)"
          trap 'rm -rf "$fetch_directory"' EXIT
          mkdir -p "$fetch_directory/src"
          cp src/fetch.py "$fetch_directory/src/fetch.py"
          
          if python "$fetch_directory/src/fetch.py" --season "$SEASON"; then
            snapshots=("$fetch_directory"/data/*.json)
            if [[ ${#snapshots[@]} -eq 1 && -f "${snapshots[0]}" ]]; then
              mkdir -p data
              latest_file=$(ls data/????-??-??.json 2>/dev/null | sort | tail -n 1)
              
              if [[ -n "$latest_file" ]] && cmp -s "${snapshots[0]}" "$latest_file"; then
                echo "Data matches the latest commit exactly ($latest_file). Skipping branch creation and summary."
                echo "changed=false" >> "$GITHUB_OUTPUT"
              else
                echo "New data found. Proceeding with branch creation."
                mv "${snapshots[0]}" "data/$SNAPSHOT_DATE.json"
                echo "changed=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "Fetch succeeded but did not produce exactly one JSON file."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Fetch script failed. Check logs for details."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse weekly snapshot branch
        if: steps.fetch.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.schedule.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            git fetch origin "$BRANCH"
            git checkout -b "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi

      - name: Generate daily summary
        if: steps.fetch.outputs.changed == 'true'
        continue-on-error: true
        run: |
          NEW_DATA_FILE="data/${{ steps.schedule.outputs.date }}.json"
          
          if ! python src/summarize.py --data_file "$NEW_DATA_FILE"; then
            echo "Summary model call failed; restoring previous summary and carrying on to commit snapshot."
            git checkout -- data/summary.md 2>/dev/null || rm -f data/summary.md
          fi

      - name: Commit snapshot and summary
        id: commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the new data snapshot
          git add -f "data/${{ steps.schedule.outputs.date }}.json"
          
          # Stage the summary file if it exists (whether updated or untouched)
          if [[ -f "data/summary.md" ]]; then
            git add "data/summary.md"
          fi
          
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          git commit -m "Add NCAAF snapshot and update summary for ${{ steps.schedule.outputs.date }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push snapshot branch
        if: steps.commit.outputs.changed == 'true'
        run: git push -u origin "${{ steps.schedule.outputs.branch }}"

      - name: Create Pull Request
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.schedule.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists for this branch to prevent errors
          if ! gh pr list --head "$BRANCH" --base main --json id | grep -q '"id"'; then
            gh pr create --title "Automated NCAAF Data Update: ${{ steps.schedule.outputs.date }}" \
                         --body "Automated update pushing new json data and summary markdown to main." \
                         --base main \
                         --head "$BRANCH"
          else
            echo "PR already exists for $BRANCH"
          fi

      - name: Approve Pull Request from Personal Account
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.schedule.outputs.branch }}
          GH_TOKEN: ${{ secrets.USER_PAT }} 
        run: |
          gh pr review "$BRANCH" --approve --body "Automatically approved to satisfy branch protection rules."

      - name: Merge Pull Request from Personal Account
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.schedule.outputs.branch }}
          GH_TOKEN: ${{ secrets.USER_PAT }} 
        run: |
          gh pr merge "$BRANCH" --merge --delete-branch

  refresh-summary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SEASON: ${{ github.event.inputs.season || '2026' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate summary from existing snapshots
        run: python src/summarize.py --season "$SEASON"

      - name: Commit and push summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.md
          if git diff --cached --quiet; then
            echo "Summary unchanged; nothing to commit."
            exit 0
          fi
          latest="$(ls data/????-??-??.json | sort | tail -n 1 | xargs basename -s .json)"
          git commit -m "Refresh standings summary through $latest"
          git push origin HEAD:main