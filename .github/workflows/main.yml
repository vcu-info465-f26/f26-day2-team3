name: Fetch NCAAF standings Data in Json

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to fetch"
        required: true
        default: "2026"

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    env:
      SEASON: ${{ github.event.inputs.season || '2026' }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Eastern schedule time
        id: schedule
        run: |
          run_date="$(TZ=America/New_York date '+%Y-%m-%d')"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$(TZ=America/New_York date '+%H:%M')" == "00:00" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "date=$run_date" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch standings
        run: SNAPSHOT_DATE="${{ steps.schedule.outputs.date }}" python src/fetch.py --season "$SEASON"
        if: steps.schedule.outputs.run == 'true'

      - name: Verify daily snapshot
        run: test -f "data/${{ steps.schedule.outputs.date }}.json"
        if: steps.schedule.outputs.run == 'true'

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "data/${{ steps.schedule.outputs.date }}.json"
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "Add NCAAF snapshot for ${{ steps.schedule.outputs.date }}"
          git push
        if: steps.schedule.outputs.run == 'true'
